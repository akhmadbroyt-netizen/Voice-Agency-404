<!doctype html>
<html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Agency 404 · Avtoservis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap">
<script>
try {
  const saved = localStorage.getItem('voice404-theme');
  document.documentElement.dataset.theme = saved === 'day' || saved === 'night'
    ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
} catch {
  document.documentElement.dataset.theme = 'night';
}
</script>
<style>
:root {
  color-scheme: dark;
  --canvas: #000;
  --panel: #0e0e0e;
  --raised: #171717;
  --line: #262626;
  --line-strong: #3d3d3d;
  --muted: #9a9a9a;
  --ink: #fff;
  --inverse: #000;
  --interactive: #121212;
  --hover: #1f1f1f;
  --border-control: #4a4a4a;
  --calendar-head: #0e0e0e;
  --focus: #fff;
  --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme=day] {
  color-scheme: light;
  --canvas: #f2f2f2;
  --panel: #fff;
  --raised: #f5f5f5;
  --line: #dcdcdc;
  --line-strong: #b5b5b5;
  --muted: #5c5c5c;
  --ink: #000;
  --inverse: #fff;
  --interactive: #fff;
  --hover: #ececec;
  --border-control: #9e9e9e;
  --calendar-head: #fff;
  --focus: #000;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
header, main { width: min(100% - 64px, 1480px); margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
.muted, dt { color: var(--muted); }

/* Header */
header { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; }
.brand-mark { display: grid; place-items: center; min-width: 46px; height: 30px; padding: 0 8px; background: var(--ink); color: var(--inverse); font-weight: 800; font-size: 15px; font-stretch: 125%; letter-spacing: -.02em; }
.header-actions { display: flex; gap: 14px; align-items: center; }
.theme-switch { display: flex; padding: 2px; border: 1px solid var(--line-strong); border-radius: 999px; }
.theme-switch button { min-height: 28px; padding: 3px 12px; border: 0; border-radius: 999px; background: transparent; font-weight: 500; }
.theme-switch button[aria-pressed=true] { background: var(--ink); color: var(--inverse); }
#status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
#status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--muted); }
#status[data-live="true"]::before { background: var(--ink); border-color: var(--ink); }
#status[data-live="false"] { color: var(--ink); text-decoration: line-through; }

/* Business lines: tabs, the active line is underlined */
#businessBar { display: flex; gap: 2px; overflow-x: auto; margin: 0; border-block: 1px solid var(--line); scrollbar-width: none; }
#businessBar button { display: inline-flex; align-items: center; gap: 8px; flex: none; min-height: 48px; padding: 0 16px; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-weight: 500; box-shadow: inset 0 -2px transparent; }
#businessBar button:hover { color: var(--ink); background: transparent; }
#businessBar [aria-pressed=true] { color: var(--ink); box-shadow: inset 0 -2px var(--ink); }
#businessBar svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#businessBar button:disabled { opacity: .5; }

main { padding-block: 0 56px; }

/* Hero: the business name is the loudest thing on the page */
#workspaceHero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; padding: 44px 0 28px; }
h1 { font-size: clamp(44px, 8.4vw, 128px); line-height: .86; font-weight: 800; font-stretch: 125%; letter-spacing: -.045em; margin-bottom: 18px; overflow-wrap: anywhere; }
#businessSubtitle { font-size: 16px; max-width: 46ch; }
#roomFilters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
#roomFilters:empty { display: none; }
#roomFilters button { border-radius: 999px; }
#roomFilters [aria-pressed=true] { background: var(--ink); color: var(--inverse); border-color: var(--ink); }
#businessFeedback:empty { display: none; }
#businessFeedback { margin-bottom: 16px; }

/* Live call: the one moving thing on the page */
#live { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px 20px; margin: 0 0 20px; padding: 14px 18px; background: var(--ink); color: var(--inverse); }
#live[hidden] { display: none; }
#live .pulse { display: flex; align-items: center; gap: 3px; height: 22px; }
#live .pulse i { display: block; width: 3px; height: 100%; background: currentColor; transform-origin: center; animation: wave 1.1s ease-in-out infinite; }
#live .pulse i:nth-child(2) { animation-delay: -.9s; }
#live .pulse i:nth-child(3) { animation-delay: -.6s; }
#live .pulse i:nth-child(4) { animation-delay: -.3s; }
#live .pulse i:nth-child(5) { animation-delay: -.75s; }
@keyframes wave { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
#live strong { font-weight: 700; font-stretch: 125%; font-size: 15px; }
#liveWho { opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#liveTimer { font-weight: 600; font-size: 20px; letter-spacing: -.02em; }
#liveOpen { background: var(--inverse); color: var(--ink); border-color: var(--inverse); border-radius: 999px; }
#liveOpen:hover { background: var(--inverse); opacity: .85; }

/* Metrics: one instrument strip, conversion is the only inverted reading */
.metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin: 0 0 20px; border: 1px solid var(--line); background: var(--panel); }
.metric { display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 6px; padding: 18px 18px 16px; border-left: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.metric:first-child { border-left: 0; }
.metric strong { color: var(--ink); font-weight: 700; font-size: 40px; line-height: 1; font-stretch: 125%; letter-spacing: -.04em; }
.metric:nth-child(3) { background: var(--ink); color: var(--inverse); }
.metric:nth-child(3) strong { color: var(--inverse); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 380px); gap: 20px; align-items: start; }
section, aside { min-width: 0; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
h2 { font-size: 18px; line-height: 1.2; font-weight: 700; font-stretch: 112%; letter-spacing: -.02em; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

/* Controls */
button, select, input { min-height: 36px; border: 1px solid var(--border-control); border-radius: 6px; background: var(--interactive); color: var(--ink); font: 500 13px/1.2 var(--sans); padding: 6px 12px; }
button, select { cursor: pointer; }
button { transition: background-color 120ms, color 120ms, border-color 120ms; }
button:hover { background: var(--hover); }
button:active { transform: translateY(1px); }
button:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { cursor: wait; opacity: .55; }
#today, .primary { background: var(--ink); border-color: var(--ink); color: var(--inverse); font-weight: 600; }
#today:hover, .primary:hover { background: var(--ink); opacity: .85; }
#prev, #next { min-width: 36px; padding: 6px; font-size: 16px; }

/* Calendar */
.schedule, #history { max-height: min(66vh, 720px); overflow: auto; scrollbar-color: var(--line-strong) transparent; }
.grid { display: grid; grid-template-columns: 60px repeat(7, minmax(92px, 1fr)); min-width: 704px; }
.heading { position: sticky; top: 0; z-index: 1; display: grid; place-content: center; min-height: 52px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: var(--calendar-head); color: var(--muted); font-weight: 500; text-align: center; }
.heading:hover { color: var(--ink); background: var(--calendar-head); }
.heading[aria-current=date] { color: var(--ink); font-weight: 700; box-shadow: inset 0 -3px var(--ink); }
.heading[aria-pressed=true] { background: var(--ink); color: var(--inverse); }
.clock, .slot { min-height: 48px; border-bottom: 1px solid var(--line); padding: 6px; }
.clock { padding: 7px 8px; text-align: right; }
.clock, .heading:first-child { font-size: 11px; color: var(--muted); }
.stamp { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); font-weight: 400; }
.slot { min-width: 0; border-left: 1px solid var(--line); }
.slot:hover { background: var(--raised); }
.slot.now { box-shadow: inset 0 2px var(--ink); background: var(--raised); }
.clock.now { color: var(--ink); font-weight: 700; }
.event { display: block; min-height: 30px; width: 100%; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; font-size: 12px; border-radius: 4px; border: 1px solid var(--ink); background: var(--panel); }
.event.offered { border-style: dashed; }
.event.void { border-color: var(--line-strong); color: var(--muted); text-decoration: line-through; }
.event.confirmed { background: var(--ink); border-color: var(--ink); color: var(--inverse); font-weight: 600; }
.event.confirmed:hover { background: var(--ink); opacity: .85; }
.event.is-live { outline: 2px solid var(--ink); outline-offset: 2px; }

/* History */
.search { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; border-radius: 999px; padding-inline: 16px; }
#history { padding: 0 16px; }
.empty { padding-block: 28px; text-align: center; }
#history > details { padding: 14px 0; border-bottom: 1px solid var(--line); }
#history > details:last-child { border-bottom: 0; }
#history > details.is-live { margin-inline: -16px; padding-inline: 16px; box-shadow: inset 3px 0 var(--ink); }
summary { cursor: pointer; font-weight: 600; font-size: 15px; }
summary::marker { color: var(--muted); }
details.is-live > summary::after { content: "Jonli"; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--inverse); font-size: 11px; font-weight: 600; vertical-align: 2px; }
.issue { margin-top: 10px; font-size: 15px; overflow-wrap: anywhere; }
dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 5px 10px; margin: 14px 0; font-size: 13px; }
dd { margin: 0; overflow-wrap: anywhere; }
.decision { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.decision details, .decision p { flex-basis: 100%; }
.decision details { padding: 8px 0 0; border: 0; }
.decision input, .decision select { margin: 8px 4px 4px 0; max-width: 100%; }
.callback { margin: 10px 0; padding: 10px 12px; border-left: 3px solid var(--ink); background: var(--raised); overflow-wrap: anywhere; }
.booking-status { display: inline-block; margin: 6px 6px 0 0; padding: 2px 9px; border: 1px solid var(--ink); border-radius: 999px; font-size: 11px; font-weight: 600; }
.booking-status[data-state=accepted] { background: var(--ink); color: var(--inverse); }
.booking-status[data-state=offered], .booking-status[data-state=deposit] { border-style: dashed; }
.booking-status[data-state=rejected], .booking-status[data-state=cancelled] { border-color: var(--line-strong); color: var(--muted); text-decoration: line-through; }

/* Restaurant menu */
.menu-block { margin: 12px 0; border: 1px solid var(--line); padding: 12px 14px; background: var(--raised); }
.menu-block h3 { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
.menu-block ul { margin: 0 0 10px; padding-left: 18px; overflow-wrap: anywhere; }
.menu-block textarea { background: var(--panel); color: var(--ink); display: block; width: 100%; min-height: 80px; resize: vertical; border: 1px solid var(--border-control); border-radius: 6px; margin: 8px 0; padding: 8px 10px; font: inherit; }
.menu-block details { padding: 0; border: 0; }
body[data-business=restaurant] .layout { grid-template-columns: minmax(0, 1fr) minmax(360px, 430px); }

@media (max-width: 1200px) {
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metric:nth-child(4) { border-left: 0; }
  .metric:nth-child(n+4) { border-top: 1px solid var(--line); }
}
@media (max-width: 1100px) { body[data-business=restaurant] .layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 990px) {
  header, main { width: min(100% - 32px, 1480px); }
  .layout { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 650px) {
  #workspaceHero { grid-template-columns: minmax(0, 1fr); padding: 28px 0 20px; }
  #roomFilters { justify-content: flex-start; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metric, .metric:nth-child(4) { border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 14px; }
  .metric:nth-child(odd) { border-left: 0; }
  .metric:nth-child(-n+2) { border-top: 0; }
  .metric strong { font-size: 30px; }
  .schedule { max-height: 55vh; }
  #live { grid-template-columns: auto minmax(0, 1fr) auto; }
  #liveWho { grid-column: 1 / -1; grid-row: 2; }
  #liveOpen { grid-column: 1 / -1; }
}
@media (max-width: 540px) {
  header { padding: 10px 0; flex-wrap: wrap; gap: 8px; }
  .header-actions { flex-wrap: wrap; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
  button:active { transform: none; }
  #live .pulse i { animation: none; transform: scaleY(.6); }
}
</style>
<header><span class="brand"><span class="brand-mark">404</span>Voice Agency</span><div class="header-actions">
<div class="theme-switch" role="group" aria-label="Rang rejimi">
<button type="button" data-theme-mode="day">Kunduz</button><button type="button" data-theme-mode="night">Tun</button>
</div><span id="status" role="status">Ulanmoqda</span></div></header>
<main>
<nav id="businessBar" aria-label="Qo‘ng‘iroqlar uchun faol xizmat"></nav>
<div id="workspaceHero"><div><h1 id="businessTitle">Avtoservis</h1><p id="businessSubtitle" class="muted">Bronlar va Telegram qo‘ng‘iroqlari</p></div>
<div id="roomFilters" role="group" aria-label="Xonalar filtri"></div></div>
<p id="businessFeedback" class="muted" role="status"></p>
<div id="live" role="status" aria-live="polite" hidden><span class="pulse" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><strong id="liveTitle">Jonli qo‘ng‘iroq</strong><span id="liveWho"></span><span id="liveTimer">00:00</span><button type="button" id="liveOpen">Kartani ochish</button></div>
<div class="metrics" id="metrics"></div>
<div class="layout">
<section aria-label="Haftalik kalendar"><div class="bar"><h2 id="week"></h2><div class="controls"><select id="worker" aria-label="Usta"><option value="">Barcha ustalar</option><option>Aziz</option><option>Bekzod</option></select><button id="prev" aria-label="Oldingi hafta">←</button> <button id="today">Bugun</button> <button id="next" aria-label="Keyingi hafta">→</button></div></div>
<div class="schedule" id="schedule"><div class="grid" id="calendar"></div></div></section>
<aside><div class="bar"><h2 id="historyTitle">Qo‘ng‘iroqlar tarixi</h2><button id="all">Hammasi</button></div><div class="search"><input id="search" type="search" placeholder="Ism, model, telefon yoki muammo" aria-label="Murojaatlarni qidirish" autocomplete="off"></div><div id="history"></div></aside>
</div></main>
<script>
const el = id => document.getElementById(id);
const themeButtons = [...document.querySelectorAll('[data-theme-mode]')];
function setTheme(mode) {
  document.documentElement.dataset.theme=mode;
  for(const button of themeButtons) button.setAttribute('aria-pressed',String(button.dataset.themeMode===mode));
}
for(const button of themeButtons) button.addEventListener('click',()=>{
  const mode=button.dataset.themeMode;
  setTheme(mode);
  try { localStorage.setItem('voice404-theme',mode); } catch {}
});
setTheme(document.documentElement.dataset.theme);
const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tashkent'}).format(new Date());
const dateKey = date => [date.getFullYear(),date.getMonth()+1,date.getDate()].map(n=>String(n).padStart(2,'0')).join('-');
const daysFrom = (date, days) => {const copy = new Date(date); copy.setDate(copy.getDate()+days); return copy;};
const [year,month,day] = today.split('-').map(Number);
const current = new Date(year,month-1,day);
const monday = daysFrom(current,-((current.getDay()+6)%7));
const dateLabel = new Intl.DateTimeFormat('uz-Latn-UZ',{day:'numeric',month:'short'});
const dayLabel = new Intl.DateTimeFormat('uz-Latn-UZ',{weekday:'short',day:'numeric'});
const money = new Intl.NumberFormat('uz-UZ');
let cursor = monday, selected = '', rows = [], allRows = [], last = '', live = {active:false}, pendingRender = false, waiting = 0;
function setTitle() {
  document.title=(live.active?'● ':waiting?'('+waiting+') ':'')+'Voice Agency 404 · '+profile.name;
}
const editing = () => {
  const active=document.activeElement;
  return Boolean(active && el('history').contains(active) && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName));
};
const matches = (row, query) => !query || [row.car,row.issue,row.service,row.phone,row.username,row.worker,row.id,...(row.menu_items||[])]
  .some(value=>String(value||'').toLocaleLowerCase('uz').includes(query));
let profile = {id:'auto',name:'Avtoservis',resource:'Usta',resources:['Aziz','Bekzod'],services:[],opens:9,closes:18};
const iconPaths = {
  auto:'M3 16v-4l2-2 2-5h10l2 5 2 2v4H3z M5 16v2 M19 16v2 M6 13h2 M16 13h2 M5 10h14',
  restaurant:'M5 3v7m4-7v7m-4-3h4m-2 3v11 M18 3c-3 3-4 6-4 9h4m0-9v18',
  beauty:'M6 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M6 13a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M9 8l12 11 M9 16 21 5',
  repair:'M7 3h10v18H7z M10 5h4 M11 18h2',
  photo:'M3 7h4l2-3h6l2 3h4v13H3z M12 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'
};
function icon(id) {
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg'), path=document.createElementNS(ns,'path');
  svg.setAttribute('viewBox','0 0 24 24');
  svg.setAttribute('aria-hidden','true');
  path.setAttribute('d',iconPaths[id]);
  svg.append(path);
  return svg;
}
async function loadBusiness() {
  const response=await fetch('/api/business');
  if(!response.ok) throw new Error('Xizmatlar yuklanmadi.');
  const {active,profiles}=await response.json();
  const bar=el('businessBar');
  function show(next) {
    profile=next;
    document.body.dataset.business=next.id;
    setTitle();
    el('businessSubtitle').textContent=next.id==='restaurant'?'Stol, xona va banket bronlari':'Bronlar va Telegram qo‘ng‘iroqlari';
    selected='';
    el('businessTitle').textContent=next.name;
    el('worker').setAttribute('aria-label',next.resource);
    el('worker').replaceChildren(new Option('Hammasi',''),...next.resources.map(value=>new Option(value)));
    el('roomFilters').replaceChildren(...(next.id==='restaurant'?['',...next.resources]:[]).map(room=>{
      const button=node('button',room || 'Barcha xonalar');
      button.dataset.room=room;
      button.onclick=()=>{el('worker').value=room;render();};
      return button;
    }));
    rows=allRows.filter(row=>row.business===next.id);
    for(const button of bar.children) button.setAttribute('aria-pressed',String(button.dataset.id===next.id));
    render();
  }
  bar.replaceChildren(...profiles.map(next=>{
    const button=node('button',next.name);
    button.prepend(icon(next.id));
    button.dataset.id=next.id;
    button.onclick=async()=>{
      if(next.id===profile.id) return;
      for(const item of bar.children) item.disabled=true;
      try {
        const response=await fetch('/api/business',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({business:next.id})});
        if(!response.ok) throw new Error('Yo‘nalish saqlanmadi.');
        show(next);
        el('businessFeedback').textContent='Keyingi qo‘ng‘iroq: '+next.name;
      } catch(error) { el('businessFeedback').textContent=error.message; }
      finally { for(const item of bar.children) item.disabled=false; }
    };
    return button;
  }));
  show(profiles.find(item=>item.id===active));
}
const calendarDate = row => row.previous_slot || (['accepted','offered'].includes(row.status) && row.slot ? row.slot : row.status ? row.created : row.visit || row.created);
const dayOf = row => calendarDate(row).slice(0,10);
const timeOf = row => calendarDate(row).slice(11,16);
function node(tag,text='',className='') {
  const item = document.createElement(tag);
  item.textContent = text;
  item.className = className;
  return item;
}
async function decide(row, action, output, slot) {
  try {
    const response=await fetch('/api/decision',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:row.id,action,slot,worker:action==='assign'?slot:undefined})
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(result.error || 'Amal bajarilmadi.');
    pull(row.id);
    output.textContent=action==='save_menu'?'Menyu saqlandi.':action==='set_service'?'Xizmat saqlandi.':action==='deposit_paid'?'Omonat qayd qilindi.':action==='assign'?profile.resource+' tanlandi.':action==='callback_done'?'Vazifa yopildi.':'Saqlandi. Telegram xabari yuboriladi.';
  } catch(error) {
    output.textContent=error.message;
  }
}
function actions(row) {
  const panel=node('div','','decision'), output=node('p','','muted');
  output.setAttribute('role','status');
  const button=(label,action,slot)=>{
    const control=node('button',label);
    if(action==='accept'||action==='offer') control.classList.add('primary');
    control.onclick=async()=>{
      control.disabled=true;
      try { await decide(row,action,output,slot?.()); }
      finally { control.disabled=false; }
    };
    return control;
  };
  const serviceKnown=profile.services.some(item=>item.label===row.service);
  if(row.issue && !['accepted','offered'].includes(row.status) && row.delivery!=='queued') {
    const service=node('select');
    service.setAttribute('aria-label','Xizmat turi');
    service.append(new Option('Xizmat tanlang',''),...profile.services.map(item=>
      new Option(profile.resource==='Xona'?item.label+' · '+item.resource:item.label,item.id)));
    service.value=profile.services.find(item=>item.label===row.service)?.id || '';
    panel.append(service,button('Xizmatni saqlash','set_service',()=>service.value));
    if(serviceKnown && !['restaurant','photo'].includes(profile.id)) {
      const worker=node('select');
      worker.setAttribute('aria-label',profile.resource);
      worker.append(...profile.resources.map(value=>new Option(value)));
      worker.value=row.worker;
      panel.append(worker,button(profile.resource+'ni tanlash','assign',()=>worker.value));
    }
  }
  const awaitingDeposit=row.deposit && !row.deposit_paid;
  if(awaitingDeposit) {
    panel.append(node('p','Bronni tasdiqlash uchun '+money.format(row.deposit)+' so‘m omonat kerak. To‘lovni olgan bo‘lsangiz, quyidagi tugmani bosing.','callback'));
    panel.append(button('Omonat olinganini qayd qilish','deposit_paid'));
  }
  if(row.callback && !row.callback_done) panel.append(button('Qayta aloqa bajarildi','callback_done'));
  if(row.delivery==='failed') panel.append(button('Xabarni qayta yuborish','retry'));
  if(!row.issue || !serviceKnown || (row.status==='accepted' && !row.move_requested) || row.delivery==='queued') {
    panel.append(output);
    return panel;
  }
  const requestedTime = row.visit?.includes('T') && Date.parse(row.visit+'+05:00')>Date.now();
  if(requestedTime && !row.status && !awaitingDeposit)
    panel.append(button('Qabul qilish','accept',()=>row.visit));
  if(!['rejected','accepted'].includes(row.status) && !row.previous_slot) panel.append(button('Rad etish','reject'));
  const availability=node('details');
  availability.append(node('summary','Bo‘sh vaqt'));
  const dateInput=node('input');
  dateInput.type='date';
  dateInput.min=today;
  dateInput.value=row.visit?.slice(0,10)>=today?row.visit.slice(0,10):today;
  dateInput.setAttribute('aria-label','Bron yoki taklif sanasi');
  const timeInput=node('select');
  timeInput.setAttribute('aria-label','Bo‘sh soat');
  const populate=()=>{
    const busy=rows.filter(item=>item.id!==row.id && item.worker===row.worker &&
      ['accepted','offered'].includes(item.status)).flatMap(item=>
        [item.slot,item.previous_slot].filter(Boolean).map(slot=>({
          start:Date.parse(slot+'+05:00'),minutes:item.duration
        })));
    const previous=timeInput.value || row.visit;
    timeInput.replaceChildren();
    for(let i=profile.opens*2;i<profile.closes*2;i++) {
      const time=String(Math.floor(i/2)).padStart(2,'0')+(i%2?':30':':00');
      const slot=dateInput.value+'T'+time;
      const start=Date.parse(slot+'+05:00'),end=start+row.duration*60000;
      if(start>Date.now() && i*30+row.duration<=profile.closes*60 &&
        !busy.some(booked=>start<booked.start+booked.minutes*60000 && booked.start<end)) {
        const option=node('option',time);
        option.value=slot;
        timeInput.append(option);
      }
    }
    if(Array.from(timeInput.options).some(option=>option.value===previous)) timeInput.value=previous;
  };
  dateInput.onchange=populate;
  populate();
  availability.append(dateInput,timeInput);
  if(!awaitingDeposit) availability.append(button('Vaqt taklif qilish','offer',()=>timeInput.value));
  if(!awaitingDeposit && (!row.status || ['rejected','cancelled'].includes(row.status))) {
    availability.append(button('Shu vaqtga qabul qilish','accept',()=>timeInput.value || 'invalid'));
    if(!requestedTime) availability.open=true;
  }
  panel.append(availability,output);
  return panel;
}
function restaurantMenu(row) {
  const block=node('div','','menu-block');
  block.append(node('h3','Tanlangan menyu'));
  const items=row.menu_items || [];
  if(items.length) {
    const list=node('ul');
    list.append(...items.map(item=>node('li',item)));
    block.append(list);
  } else {
    block.append(node('p','Taomlar hali qayd qilinmagan.','muted'));
  }
  const editor=node('details');
  const input=node('textarea');
  input.setAttribute('aria-label','Tanlangan taomlar');
  input.placeholder='Har qatorga bitta taom';
  input.value=items.join('\n');
  const save=node('button','Menyuni saqlash'), status=node('p','','muted');
  status.setAttribute('role','status');
  save.onclick=async()=>{
    save.disabled=true;
    try { await decide(row,'save_menu',status,input.value.split('\n').map(item=>item.trim()).filter(Boolean).slice(0,30)); }
    finally { save.disabled=false; }
  };
  editor.append(node('summary','Menyuni tahrirlash'),input,save,status);
  block.append(editor);
  return block;
}
function render(openId) {
  const history = el('history'), calendar = el('calendar');
  for(const button of el('roomFilters').children) button.setAttribute('aria-pressed',String(button.dataset.room===el('worker').value));
  const opened = new Set(Array.from(history.querySelectorAll('details[open]'),item=>item.dataset.id));
  if(openId) opened.add(openId);
  const days = Array.from({length:7},(_,index)=>daysFrom(cursor,index));
  el('week').textContent = dateLabel.format(days[0]) + ' – ' + dateLabel.format(days[6]);
  calendar.replaceChildren(node('div','UTC+5','heading'));
  for(const date of days) {
    const key = dateKey(date), button = node('button',dayLabel.format(date),'heading');
    button.setAttribute('aria-pressed',String(key===selected));
    if(key===today) button.setAttribute('aria-current','date');
    button.onclick=()=>{selected=key;render();calendar.querySelector('[aria-pressed=true]').focus();};
    calendar.append(button);
  }
  const slots = new Map();
  const nowHour = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tashkent',hour:'2-digit',hourCycle:'h23'}).format(new Date());
  const thisWeek = days.some(date=>dateKey(date)===today);
  for(const hour of ['Vaqtsiz',...Array.from({length:24},(_,h)=>String(h).padStart(2,'0'))]) {
    calendar.append(node('div',hour==='Vaqtsiz'?hour:hour+':00',thisWeek && hour===nowHour?'clock now':'clock'));
    for(const date of days) {
      const slot = node('div','',dateKey(date)===today && hour===nowHour?'slot now':'slot');
      slots.set(dateKey(date)+'/'+hour,slot);
      calendar.append(slot);
    }
  }
  const currentCalls=rows.filter(row=>row.created.startsWith(today));
  const converted=currentCalls.filter(row=>row.status==='accepted'||row.previous_slot).length;
  waiting=rows.filter(row=>row.status==='offered'||row.move_requested||(!row.status&&row.visit)).length;
  setTitle();
  el('metrics').replaceChildren(...[
    ['Bugungi qo‘ng‘iroqlar',currentCalls.length],
    ['Tashrifga aylangan',converted],
    ['Konversiya',currentCalls.length?Math.round(converted*100/currentCalls.length)+'%':'—'],
    ['Javob kutmoqda',waiting],
    ['Xabar yuborilmadi',rows.filter(row=>row.delivery==='failed'||row.reminder==='failed').length],
    ['Qayta qo‘ng‘iroq',rows.filter(row=>row.callback&&!row.callback_done).length]
  ].map(([label,value])=>{
    const metric=node('div',label,'metric');
    metric.append(node('strong',value));
    return metric;
  }));
  for(const row of rows) {
    if(el('worker').value && row.worker!==el('worker').value) continue;
    const time = timeOf(row), slot = slots.get(dayOf(row)+'/'+(time.slice(0,2)||'Vaqtsiz'));
    if(!slot) continue;
    const event = node('button',[time,profile.id==='auto'?(row.car||row.service):(row.service+' · '+row.worker)].filter(Boolean).join(' '),'event');
    if(row.status==='accepted'||row.previous_slot) event.classList.add('confirmed');
    else if(row.status==='offered') event.classList.add('offered');
    else if(['rejected','cancelled'].includes(row.status)) event.classList.add('void');
    if(live.active && live.request_id===row.id) event.classList.add('is-live');
    event.onclick=()=>{selected=dayOf(row);render(row.id);document.getElementById('call-'+row.id).querySelector('summary').focus();};
    slot.append(event);
  }
  const query=el('search').value.trim().toLocaleLowerCase('uz');
  const visible = rows.filter(row=>(!el('worker').value||row.worker===el('worker').value) && (!selected||dayOf(row)===selected||row.created.startsWith(selected)) && matches(row,query));
  el('historyTitle').textContent = selected || 'Qo‘ng‘iroqlar tarixi';
  history.replaceChildren();
  if(!visible.length) history.append(node('p',query?'Qidiruv bo‘yicha murojaat topilmadi.':'Murojaatlar yo‘q.','muted empty'));
  for(const row of visible) {
    const card=node('details'), summary=node('summary',[row.car,row.service].filter(Boolean).join(' · '));
    card.id='call-'+row.id; card.dataset.id=row.id; card.open=opened.has(row.id);
    if(live.active && live.request_id===row.id) card.classList.add('is-live');
    summary.append(node('span',row.created.slice(0,16).replace('T',' '),'stamp'));
    const state=row.status==='accepted'?'accepted':row.deposit && !row.deposit_paid?'deposit':row.status||'new';
    const chip=node('span',({accepted:'Tasdiqlangan',deposit:'Omonat kutilmoqda',offered:'Mijoz javobi kutilmoqda',
      rejected:'Rad etilgan',cancelled:'Bekor qilingan'})[state] || 'Yangi so‘rov','booking-status');
    chip.dataset.state=state;
    summary.append(chip);
    card.append(summary,node('p',row.issue||'Qo‘ng‘iroq qayd qilindi. Tafsilotlar kutilmoqda.','issue'));
    const fields=node('dl');
    for(const [label,value] of [
      ['Tashrif',(row.slot||row.visit)?.replace('T',' ') || '-'],
      ...(profile.id==='restaurant' ? [['Mehmonlar',row.guests ? row.guests+' kishi' : 'Aniqlanmagan'],
        ['Nechigacha',row.visit_until || 'Aniqlanmagan']] : []),
      ['Holat',({cancelled:'Bekor qilindi',accepted:'Qabul qilindi',rejected:'Rad etildi',offered:'Mijoz javobi kutilmoqda'})[row.status] || 'So‘rov'],
      ['Xabar',({queued:'Navbatda',sent:'Yuborildi',failed:'Yuborilmadi'})[row.delivery] || '-'],
      ['Narx',row.low?money.format(row.low)+'–'+money.format(row.high)+' so‘m':'Aniqlanmagan'],
      ['Telegram',row.username?'@'+row.username:'ID '+row.caller_id],
      ['Til',({uz:'O‘zbekcha',ru:'Ruscha',en:'Inglizcha'})[row.language] || '-'],
      [profile.resource,row.worker+' · '+row.duration+' daqiqa'+(row.assigned_worker?'':' · Tavsiya')],
      ['Kelishi',({calling:'Qo‘ng‘iroq ketmoqda',coming:'Kelyapti',cannot_come:'Kela olmaydi',unclear:'Aniqlanmadi',no_answer:'Javob olmadi'})[row.attendance] || '-'],
      ['Qo‘ng‘iroq',row.consent?'Rozilik bor':'Rozilik yo‘q'],
      ['Kutish navbati',row.waitlist?'Qo‘shilgan':'Qo‘shilmagan'],
      ...(row.deposit ? [['Omonat',money.format(row.deposit)+' so‘m · '+(row.deposit_paid?'Qayd qilindi':'Kutilmoqda')]] : []),
      ['Telefon',row.phone||'Berilmagan']
    ]) fields.append(node('dt',label),node('dd',value));
    if(row.move_requested) card.append(node('p','Mijoz vaqtni ko‘chirishni so‘radi.','callback'));
    if(row.previous_slot) card.append(node('p','Eski bron saqlangan: '+row.previous_slot.replace('T',' '),'callback'));
    if(row.callback) card.append(node('p',(row.callback_done?'Qayta aloqa bajarildi: ':'Usta qayta qo‘ng‘iroq qilsin: ')+row.callback,'callback'));
    card.append(fields);
    if(profile.id==='restaurant') card.append(restaurantMenu(row));
    card.append(actions(row)); history.append(card);
  }
}
el('worker').onchange=()=>render();
el('prev').onclick=()=>{cursor=daysFrom(cursor,-7);selected='';render();};
el('next').onclick=()=>{cursor=daysFrom(cursor,7);selected='';render();};
el('today').onclick=()=>{cursor=monday;selected='';render();};
el('all').onclick=()=>{selected='';el('search').value='';render();};
el('search').oninput=()=>render();
// Background refreshes wait while staff type in a card, so a new call never wipes their edits.
function safeRender(openId) {
  if(editing()) { pendingRender=true; return; }
  pendingRender=false;
  render(openId);
}
el('history').addEventListener('focusout',()=>setTimeout(()=>{ if(pendingRender) safeRender(); },0));
function openLive() {
  const row=allRows.find(item=>item.id===live.request_id);
  if(!row) return;
  selected='';
  el('search').value='';
  render(row.id);
  document.getElementById('call-'+row.id)?.scrollIntoView({block:'nearest'});
  document.getElementById('call-'+row.id)?.querySelector('summary').focus();
}
el('liveOpen').onclick=openLive;
function showLive() {
  const banner=el('live');
  banner.hidden=!live.active;
  if(!live.active) return;
  const row=allRows.find(item=>item.id===live.request_id);
  el('liveTitle').textContent=live.direction==='outbound'?'AI mijozga qo‘ng‘iroq qilmoqda':'Jonli qo‘ng‘iroq';
  el('liveWho').textContent=row ? (row.username?'@'+row.username:'ID '+row.caller_id)+(row.car?' · '+row.car:'') : 'ID '+live.caller_id;
  el('liveOpen').hidden=!row;
  const seconds=Math.max(0,Math.floor((Date.now()-Date.parse(live.since))/1000));
  el('liveTimer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
}
setInterval(showLive,1000);
async function pull(openId) {
  try {
    const [response,liveResponse]=await Promise.all([fetch('/api/requests'),fetch('/api/live')]);
    if(!response.ok || !liveResponse.ok) throw new Error('Server unavailable');
    const payload=await response.text(), nextLive=await liveResponse.json();
    const liveChanged=nextLive.active!==live.active || nextLive.request_id!==live.request_id;
    live=nextLive;
    if(payload!==last){allRows=JSON.parse(payload);rows=allRows.filter(row=>row.business===profile.id);last=payload;safeRender(openId);}
    else if(liveChanged || openId) safeRender(openId);
    showLive();
    setTitle();
    el('status').dataset.live='true';
    el('status').textContent='Lokal · Ulangan';
  } catch(error) {
    console.warn('Dashboard refresh failed:',error);
    el('status').dataset.live='false';
    el('status').textContent='Aloqa uzildi';
  }
}
async function refresh() {
  await pull();
  setTimeout(refresh,2500);
}
render();
el('schedule').scrollTop=230;
loadBusiness().catch(error=>{el('businessFeedback').textContent=error.message;});
refresh();
</script>
