<!doctype html>
<html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Agency 404 · Avtoservis</title>
<style>
:root{color-scheme:dark;--line:#303030;--dim:#aaa;--ink:#f4f4f4;--panel:#141414}
*{box-sizing:border-box}body{margin:0;background:#090909;color:var(--ink);font:14px system-ui,sans-serif}
header,main{max-width:1560px;margin:auto;padding-inline:28px}header{height:68px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand{letter-spacing:-.025em;font-weight:750}.muted,#status,dt{color:var(--dim)}#status,.clock,.stamp{font:12px ui-monospace,monospace}
main{padding-block:32px}h1,h2,p{margin:0}h1{font-size:clamp(36px,6vw,64px);line-height:1;letter-spacing:-.075em;margin-bottom:12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:26px;align-items:start}
section,aside{border:1px solid var(--line);background:var(--panel);min-width:0}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}h2{font-size:16px}
button{font:inherit;background:transparent;color:inherit;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:6px 9px}
button:hover{background:#303030}button:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.schedule{overflow:auto;max-height:68vh}.grid{display:grid;grid-template-columns:62px repeat(7,minmax(100px,1fr));min-width:762px}
.heading{position:sticky;top:0;z-index:1;background:#1b1b1b;min-height:46px;display:grid;place-content:center;border-radius:0;border:0;border-bottom:1px solid var(--line);text-align:center}.heading[aria-pressed=true]{background:#eee;color:#101010}.heading[aria-current=date]{text-decoration:underline}
.clock,.slot{min-height:42px;border-bottom:1px solid var(--line);padding:6px}.clock{color:var(--dim)}.slot{border-left:1px solid var(--line);min-width:0}
.event{display:block;width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;text-align:left;background:#292929;font-size:11px;margin-bottom:3px}
#history{max-height:68vh;overflow:auto;padding:0 14px}.empty{padding-block:14px}details{padding:12px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:650}.stamp{display:block;color:var(--dim);margin-top:4px}.issue{margin-top:10px;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:88px 1fr;gap:6px}dd{margin:0;overflow-wrap:anywhere}
@media(max-width:850px){.layout{grid-template-columns:1fr}header,main{padding-inline:14px}.schedule{max-height:55vh}}
.decision{display:flex;gap:6px;flex-wrap:wrap}.decision details,.decision p{flex-basis:100%}.decision input,.decision select{font:inherit;margin:8px 4px 4px 0;max-width:100%}
</style>
<header><span class="brand">VOICE AGENCY / 404</span><span id="status" role="status">Ulanmoqda</span></header>
<main><h1>Avtoservis</h1><p class="muted">Diagnostika jadvali va Telegram qo‘ng‘iroqlari</p>
<div class="layout">
<section aria-label="Haftalik kalendar"><div class="bar"><h2 id="week"></h2><div><button id="prev" aria-label="Oldingi hafta">←</button> <button id="today">Bugun</button> <button id="next" aria-label="Keyingi hafta">→</button></div></div>
<div class="schedule" id="schedule"><div class="grid" id="calendar"></div></div></section>
<aside><div class="bar"><h2 id="historyTitle">Qo‘ng‘iroqlar tarixi</h2><button id="all">Hammasi</button></div><div id="history"></div></aside>
</div></main>
<script>
const el = id => document.getElementById(id);
const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tashkent'}).format(new Date());
const dateKey = date => [date.getFullYear(),date.getMonth()+1,date.getDate()].map(n=>String(n).padStart(2,'0')).join('-');
const daysFrom = (date, days) => {const copy = new Date(date); copy.setDate(copy.getDate()+days); return copy;};
const [year,month,day] = today.split('-').map(Number);
const current = new Date(year,month-1,day);
const monday = daysFrom(current,-((current.getDay()+6)%7));
const dateLabel = new Intl.DateTimeFormat('uz-Latn-UZ',{day:'numeric',month:'short'});
const dayLabel = new Intl.DateTimeFormat('uz-Latn-UZ',{weekday:'short',day:'numeric'});
const money = new Intl.NumberFormat('uz-UZ');
let cursor = monday, selected = '', rows = [], last = '';
const calendarDate = row => row.status === "accepted" ? row.slot : row.status ? row.created : row.visit || row.created;
const dayOf = row => calendarDate(row).slice(0,10);
const timeOf = row => calendarDate(row).slice(11,16);
function node(tag,text='',className='') {
  const item = document.createElement(tag);
  item.textContent = text;
  item.className = className;
  return item;
}
async function decide(row, action, output, slot) {
  try {
    const response=await fetch('/api/decision',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:row.id,action,slot})
    });
    const result=await response.json();
    if(!response.ok) throw new Error(result.error || 'Amal bajarilmadi.');
    output.textContent='Saqlandi. Telegram xabari yuboriladi.';
  } catch(error) {
    output.textContent=error.message;
  }
}
function actions(row) {
  const panel=node('div','','decision'), output=node('p','','muted');
  output.setAttribute('role','status');
  const button=(label,action,slot)=>{
    const control=node('button',label);
    control.onclick=()=>decide(row,action,output,slot?.());
    return control;
  };
  if(row.delivery==='failed') panel.append(button('Xabarni qayta yuborish','retry'));
  if(!row.issue || row.status==='accepted' || row.delivery==='queued') {
    panel.append(output);
    return panel;
  }
  if(row.visit?.includes('T') && !row.status) panel.append(button('Qabul qilish','accept'));
  if(row.status!=='rejected') panel.append(button('Rad etish','reject'));
  const availability=node('details');
  availability.append(node('summary','Bo‘sh vaqt'));
  const dateInput=node('input');
  dateInput.type='date';
  dateInput.min=today;
  dateInput.value=row.visit?.slice(0,10)>=today?row.visit.slice(0,10):today;
  dateInput.setAttribute('aria-label','Taklif sanasi');
  const timeInput=node('select');
  timeInput.setAttribute('aria-label','Bo‘sh soat');
  const populate=()=>{
    const busy=rows.filter(item=>['accepted','offered'].includes(item.status)).map(item=>Date.parse(item.slot+'+05:00'));
    timeInput.replaceChildren();
    for(let i=18;i<36;i++) {
      const time=String(Math.floor(i/2)).padStart(2,'0')+(i%2?':30':':00');
      const slot=dateInput.value+'T'+time;
      const start=Date.parse(slot+'+05:00');
      if(start>Date.now() && !busy.some(booked=>Math.abs(booked-start)<30*60000)) {
        const option=node('option',time);
        option.value=slot;
        timeInput.append(option);
      }
    }
  };
  dateInput.onchange=populate;
  populate();
  availability.append(dateInput,timeInput,button('Vaqt taklif qilish','offer',()=>timeInput.value));
  panel.append(availability,output);
  return panel;
}
function render(openId) {
  const history = el('history'), calendar = el('calendar');
  const opened = new Set(Array.from(history.querySelectorAll('details[open]'),item=>item.dataset.id));
  if(openId) opened.add(openId);
  const days = Array.from({length:7},(_,index)=>daysFrom(cursor,index));
  el('week').textContent = dateLabel.format(days[0]) + ' – ' + dateLabel.format(days[6]);
  calendar.replaceChildren(node('div','UTC+5','heading'));
  for(const date of days) {
    const key = dateKey(date), button = node('button',dayLabel.format(date),'heading');
    button.setAttribute('aria-pressed',String(key===selected));
    if(key===today) button.setAttribute('aria-current','date');
    button.onclick=()=>{selected=key;render();calendar.querySelector('[aria-pressed=true]').focus();};
    calendar.append(button);
  }
  const slots = new Map();
  for(const hour of ['Vaqtsiz',...Array.from({length:24},(_,h)=>String(h).padStart(2,'0'))]) {
    calendar.append(node('div',hour==='Vaqtsiz'?hour:hour+':00','clock'));
    for(const date of days) {
      const slot = node('div','','slot');
      slots.set(dateKey(date)+'/'+hour,slot);
      calendar.append(slot);
    }
  }
  for(const row of rows) {
    const time = timeOf(row), slot = slots.get(dayOf(row)+'/'+(time.slice(0,2)||'Vaqtsiz'));
    if(!slot) continue;
    const event = node('button',[time,row.car||row.service].filter(Boolean).join(' '),'event');
    event.onclick=()=>{selected=dayOf(row);render(row.id);document.getElementById('call-'+row.id).querySelector('summary').focus();};
    slot.append(event);
  }
  const visible = rows.filter(row=>!selected||dayOf(row)===selected||row.created.startsWith(selected));
  el('historyTitle').textContent = selected || 'Qo‘ng‘iroqlar tarixi';
  history.replaceChildren();
  if(!visible.length) history.append(node('p','Murojaatlar yo‘q.','muted empty'));
  for(const row of visible) {
    const card=node('details'), summary=node('summary',[row.car,row.service].filter(Boolean).join(' · '));
    card.id='call-'+row.id; card.dataset.id=row.id; card.open=opened.has(row.id);
    summary.append(node('span',row.created.slice(0,16).replace('T',' '),'stamp'));
    card.append(summary,node('p',row.issue||'Qo‘ng‘iroq qayd qilindi. Tafsilotlar kutilmoqda.','issue'));
    const fields=node('dl');
    for(const [label,value] of [
      ['Diagnostika',(row.slot||row.visit)?.replace('T',' ') || '-'],
      ['Holat',({accepted:'Qabul qilindi',rejected:'Rad etildi',offered:'Mijoz javobi kutilmoqda'})[row.status] || 'So‘rov'],
      ['Xabar',({queued:'Navbatda',sent:'Yuborildi',failed:'Yuborilmadi'})[row.delivery] || '-'],
      ['Narx',row.low?money.format(row.low)+'–'+money.format(row.high)+' so‘m':'Aniqlanmagan'],
      ['Telegram',row.username?'@'+row.username:'ID '+row.caller_id],
      ['Telefon',row.phone||'Berilmagan']
    ]) fields.append(node('dt',label),node('dd',value));
    card.append(fields,actions(row)); history.append(card);
  }
}
el('prev').onclick=()=>{cursor=daysFrom(cursor,-7);selected='';render();};
el('next').onclick=()=>{cursor=daysFrom(cursor,7);selected='';render();};
el('today').onclick=()=>{cursor=monday;selected='';render();};
el('all').onclick=()=>{selected='';render();};
async function refresh() {
  try {
    const response=await fetch('/api/requests');
    if(!response.ok) throw new Error('Server unavailable');
    const payload=await response.text();
    if(payload!==last){rows=JSON.parse(payload);last=payload;render();}
    el('status').textContent='Lokal · Ulangan';
  } catch {el('status').textContent='Aloqa uzildi';}
  finally {setTimeout(refresh,2500);}
}
render();
el('schedule').scrollTop=230;
refresh();
</script>
</html>
